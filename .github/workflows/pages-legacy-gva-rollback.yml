name: Roll back GitHub Pages to fixed legacy GVA anchor

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with national deployment and the historical pages workflow. Do not
# cancel an in-flight rollback automatically.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixed legacy GVA anchor
        uses: actions/checkout@v5
        with:
          ref: f7a3532f633a247f33dee3ebba9fbcc316c0e534

      - name: Set up historical Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install historical development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download and verify fixed public data bundle
        run: python scripts/download_public_data_bundle.py

      - name: Build and validate historical public GVA profile
        run: |
          python scripts/build_frontend_profile.py --profile public --output data/web/gva/manifest.json
          python scripts/validate_frontend_assets.py
          python scripts/validate_recent_frontend_assets.py --public-only
          python scripts/validate_egif_frontend_assets.py
          python scripts/validate_esfire30_frontend_assets.py
          python scripts/build_public_site.py --output data/derived/gva/publication/site
          python scripts/validate_public_site.py --site data/derived/gva/publication/site
          printf '%s\n' 'legacy GVA anchor build and site validation PASS' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - name: Upload fixed legacy GVA Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/derived/gva/publication/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
