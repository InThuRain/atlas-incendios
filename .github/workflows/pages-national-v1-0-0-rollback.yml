name: Roll back Pages to exact national product v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the legacy workflow and pages.yml. A rollback is queued rather
# than cancelled while an operator investigates a national deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Download fixed golden national archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/InThuRain/atlas-incendios-es4c3d4-pages-staging/releases/download/national-product-post2-staging-es4post4/national-product-post2-patch.tar.gz' \
            --output national-product-post2-patch.tar.gz

      - name: Verify archive, extract safely and gate exact site identity
        run: |
          python scripts/check_national_product_release_gate.py \
            --archive national-product-post2-patch.tar.gz \
            --contract config/national-product-post2-patch-identity.json \
            --extract-to site \
            --output runner-national-product-identity.json | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'golden archive identity PASS; runner site identity PASS' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preserve runner identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: national-product-runner-identity
          path: runner-national-product-identity.json
          if-no-files-found: error

      - uses: actions/configure-pages@v5
      - name: Upload exact national Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
