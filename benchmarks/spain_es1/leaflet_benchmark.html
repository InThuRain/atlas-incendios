<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ES-1 Leaflet national benchmark</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #result { display: none; }
  </style>
</head>
<body>
  <div id="map"></div><pre id="result">pending</pre>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  'use strict';
  (function () {
    const resultNode = document.getElementById('result');
    const dataset = new URLSearchParams(location.search).get('dataset');
    function finish(value) {
      resultNode.textContent = JSON.stringify(value);
      resultNode.dataset.complete = 'true';
    }
    try {
      if (!dataset) throw new Error('Missing dataset query parameter');
      const heapStart = performance.memory ? performance.memory.usedJSHeapSize : null;
      const fetchStart = performance.now();
      const request = new XMLHttpRequest();
      request.open('GET', '/' + dataset.replace(/^\/+/, ''), false);
      request.send();
      if (request.status < 200 || request.status >= 300) {
        throw new Error('HTTP ' + request.status);
      }
      const text = request.responseText;
      const fetchMs = performance.now() - fetchStart;
      const parseStart = performance.now();
      const parsed = JSON.parse(text);
      const parseMs = performance.now() - parseStart;
      const map = L.map('map', {
        preferCanvas: true,
        zoomControl: false,
        attributionControl: false
      });
      const renderStart = performance.now();
      const layer = L.geoJSON(parsed, {
        style: {weight: 0.6, fillOpacity: 0.18, interactive: false}
      }).addTo(map);
      map.fitBounds(layer.getBounds(), {padding: [8, 8]});
      if (map._renderer && map._renderer._redraw) map._renderer._redraw();
      const renderMs = performance.now() - renderStart;
      const heapEnd = performance.memory ? performance.memory.usedJSHeapSize : null;
      finish({
        leaflet_version: L.version,
        prefer_canvas: true,
        dataset: dataset,
        geometry_count: parsed.features.length,
        source_bytes: new TextEncoder().encode(text).length,
        fetch_ms: fetchMs,
        parse_ms: parseMs,
        render_ms: renderMs,
        heap_delta_bytes: heapStart === null ? null : Math.max(0, heapEnd - heapStart)
      });
    } catch (error) {
      finish({error: String(error && error.stack || error)});
    }
  }());
  </script>
</body>
</html>
